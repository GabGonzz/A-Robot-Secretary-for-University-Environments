<!DOCTYPE html>
<html>
<head>
    <title>ARI UNITN Speech and Dialogue</title>
    <!-- style and fontawesome icons -->
    <link rel="stylesheet" href="../tools/style/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- script -->
    <script src="../tools/js/lib/jquery.min.js"></script>
    <script src="../tools/js/lib/roslib.min.js"></script>
    
    <script src="../tools/js/core.js"></script>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div class="status-bar">

        <div class="status-item" id="status-date">
            <i class="fa-solid fa-calendar-days"></i>
            <span>--/--/--</span>
        </div>

        <div class="status-item" id="status-time">
            <i class="fa-solid fa-clock"></i>
            <span>00:00</span>
        </div>

        <div class="status-item" id="status-battery">
            <i class="fa-solid fa-battery-three-quarters"></i>
            <span id="battery-level">--%</span>
        </div>

    </div>

    <div class="main-container">

        <div class="top-left-controls">

            <div class="control-btn" title="Back">
                <i class="fa-solid fa-chevron-left"></i>
            </div> 
    
            <div class="control-btn" title="Home">
                <i class="fa-solid fa-house"></i>
            </div>
    
            <div class="control-btn" title="Volume">
                <i class="fa-solid fa-volume-high"></i>
            </div>

        </div>

        <div class="unitn-logo-container">
            <img id="main-logo" src="" alt="Logo UNITN" class="unitn-logo">
        </div>

        <div class="menu-header">
            <h1 class="main-title">
                <i class="fa-solid fa-comments" style="margin-right: 20px; color: #990000;"></i>
                Speech & Dialogue
            </h1>
            <p class="sub-title">Select an option</p>
        </div>

        <div class="interaction-table">
            <div class="btn-row-item" id="int_1">What is your name?</div>
            <div class="btn-row-item" id="int_2">How are you feeling today?</div>
            <div class="btn-row-item" id="int_3">Where is the BUP library?</div>
        </div>

        <div class="ai-interaction-container" style="text-align: center; margin-top: 30px;">
            <p style="color: #444; font-family: sans-serif; margin-bottom: 20px; font-size: 40px; font-weight: bold;">
                Else ask anything to me:
            </p>

            <div id="btn-ai-mic" class="control-btn" style="width: 100px; height: 100px; border-radius: 50%; background: #990000; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; transition: all 0.3s;">
                <i class="fa-solid fa-microphone" style="font-size: 43px; color: white;"></i>
            </div>
        </div>
        
    </div>

    <div id="ai-modal" class="modal-overlay" style="display: none;">

        <div class="modal-content" style="max-width: 600px; width: 85%;">

            <h3 id="ai-modal-title">Thinking...</h3>
        
            <div id="ai-loading-icon" style="padding: 20px;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 50px; color: #990000;"></i>
            </div>

            <div id="ai-response-text" style="font-size: 1.5rem; text-align: left; margin: 20px 0; max-height: 400px; overflow-y: auto; font-family: 'Segoe UI', sans-serif;">
            </div>

            <div id="ai-modal-footer" style="display: none; margin-top: 20px;">
                <button id="btn-ai-close" class="modal-btn btn-confirm">OK</button>
            </div>

        </div>

    </div>

</body>
</html>
