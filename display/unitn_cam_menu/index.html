<!DOCTYPE html>
<html>
<head>
    <title>ARI UNITN Cameras Menu</title>

    <!-- style and fontawesome icons -->
    <link rel="stylesheet" href="../tools/style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- script -->
    <script src="../tools/js/lib/jquery.min.js"></script>
    <script src="../tools/js/lib/roslib.min.js"></script>

    <script src="../tools/js/core.js"></script>

    <script src="js/main.js"></script>

</head>
<body>

    <div class="status-bar">

        <div class="status-item" id="status-date">
            <i class="fa-solid fa-calendar-days"></i>
            <span>--/--/--</span>
        </div>

        <div class="status-item" id="status-time">
            <i class="fa-solid fa-clock"></i>
            <span>00:00</span>
        </div>

        <div class="status-item" id="status-battery">
            <i class="fa-solid fa-battery-three-quarters"></i>
            <span id="battery-level">--%</span>
        </div>

    </div>

    <div class="main-container">

        <div class="top-left-controls">

            <div class="control-btn" title="Back">
                <i class="fa-solid fa-chevron-left"></i>
            </div> 
    
            <div class="control-btn" title="Home">
                <i class="fa-solid fa-house"></i>
            </div>

            <div class="control-btn" title="Volume">
                <i class="fa-solid fa-volume-high"></i>
            </div>

        </div>

        <div class="unitn-logo-container">
            <img id="main-logo" src="" alt="Logo UNITN" class="unitn-logo">
        </div>

        <div class="menu-header">
            <h1 class="main-title">
                <i class="fa-solid fa-camera" style="margin-right: 20px; color: #990000;"></i>
                Cameras Menu
            </h1>
        </div>

        <div class="btns-row" id="self_presentation_menu">
    
            <div class="btn-ari btn-action" id="front_cam_btn">
                <i class="fa-solid fa-user"></i>
                <div class="btn-label">Head camera</div>
            </div>
    
            <div class="btn-ari btn-action" id="torso_cam_btn">
                <i class="fa-solid fa-vest"></i>
                <div class="btn-label">Torso camera</div>
            </div>

            <div class="btn-ari btn-action" id="back_cam_btn">
                <i class="fa-solid fa-camera-rotate"></i>
                <div class="btn-label">Back Camera</div>
            </div>

            <div class="btn-ari btn-action" id="front_fisheye_cam_btn">
                <i class="fa-solid fa-circle-dot"></i>
                <div class="btn-label">Front Fisheye Camera</div>
            </div>

            <div class="btn-ari btn-action" id="rear_fisheye_cam_btn">
                <i class="fa-solid fa-circle-dot"></i>
                <div class="btn-label">Rear Fisheye Camera</div>
            </div>

            <div class="btn-ari btn-action" id="infra_cam_btn">
                <i class="fa-solid fa-eye-low-vision"></i>
                <div class="btn-label">Torso Infrared Camera</div>
            </div>

        </div>
        
    </div>
</body>
</html>
