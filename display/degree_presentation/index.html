<!DOCTYPE html>
<html>
<head>
    <title>ARI UNITN AIS Degree presentation</title>

    <!-- style and fontawsome icons -->
    <link rel="stylesheet" href="../tools/style/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- script -->
    <script src="../tools/js/lib/jquery.min.js"></script>
    <script src="../tools/js/lib/roslib.min.js"></script>

    <script src="../tools/js/core.js"></script>

    <script src="js/main.js"></script>

</head>
<body class="camera-page">

    <div class="status-bar">

        <div class="status-item" id="status-date">
            <i class="fa-solid fa-calendar-days"></i>
            <span>--/--/--</span>
        </div>

        <div class="status-item" id="status-time">
            <i class="fa-solid fa-clock"></i>
            <span>00:00</span>
        </div>

        <div class="status-item" id="status-battery">
            <i class="fa-solid fa-battery-three-quarters"></i>
            <span id="battery-level">--%</span>
        </div>

    </div>

    <div class="main-container">

        <div class="top-left-controls">

            <div class="control-btn" title="Back">
                <i class="fa-solid fa-chevron-left"></i>
            </div> 
    
            <div class="control-btn" title="Home">
                <i class="fa-solid fa-house"></i>
            </div>
    
            <div class="control-btn" title="Volume">
                <i class="fa-solid fa-volume-high"></i>
            </div>

        </div>

        <div class="unitn-logo-container">
            <img id="main-logo" src="" alt="Logo UNITN" class="unitn-logo">
        </div>

        <div class="menu-header">
            <h1 class="main-title">
                <i class="fa-solid fa-graduation-cap" style="margin-right: 20px; color: #990000;"></i>
                AIS Degree presentation
            </h1>
        </div>

        <div class="camera-stream-wrapper" id="fullscreen-target" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="camera-feed-container" id="video_stream" style="position: relative;">
                <video id="degree-presentation-video" playsinline>
                    <source id="video-source" src="" type="video/mp4">
                        Tag video not supported.
                </video>

                <div id="video-controls-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); cursor: pointer; transition: opacity 0.3s; z-index: 10;">
                    <i id="play-pause-icon" class="fa-solid fa-circle-play" style="font-size: 80px; color: white; opacity: 0.8;"></i>
                </div>

                <div id="fullscreen-btn" style="position: absolute; top: 15px; right: 15px; color: white; font-size: 30px; cursor: pointer; text-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 100;">
                    <i class="fa-solid fa-expand"></i>
                </div>
            </div>

            <div id="video-progress-container" style="width: 900px; max-width: 95%; height: 12px; background: #ccc; cursor: pointer; margin-top: 10px; border-radius: 6px; overflow: hidden;">
                <div id="video-progress-bar" style="width: 0%; height: 100%; background: #990000; transition: width 0.1s linear;"></div>
            </div>

        </div>
        
    </div>
</body>
</html>
